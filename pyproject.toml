[project]
name = "mission-control"
version = "0.1.0"
description = "A Textual TUI for Claude Code: repair orphaned sessions, track measurable progress, and launch work from the pane next door."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stan Karzhev" }]
keywords = ["claude-code", "tui", "textual", "sessions", "productivity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[project.urls]
Homepage = "https://github.com/StanKarz/mission-control"
Issues = "https://github.com/StanKarz/mission-control/issues"

[project.scripts]
mc = "mission_control.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mission_control"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
